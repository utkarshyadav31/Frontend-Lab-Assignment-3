<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Theme Changer</title>
<style>
  :root { --bg: #ffffff; --text: #222222; --card: #f1f3f6; --accent: #2f7de1; }
  body[data-theme="dark"]   { --bg: #121212; --text: #f0f0f0; --card: #1f1f1f; --accent: #bb86fc; }
  body[data-theme="blue"]   { --bg: #e3f0ff; --text: #0b2a4a; --card: #cfe4fb; --accent: #1565c0; }
  body[data-theme="green"]  { --bg: #e6f6ea; --text: #12361c; --card: #cdeed6; --accent: #1e9e4a; }
  body[data-theme="purple"] { --bg: #f3e8ff; --text: #3b1a5c; --card: #e4d0fa; --accent: #7b2cbf; }

  body { background: var(--bg); color: var(--text); font-family: Arial, sans-serif; margin: 0; padding: 40px 20px; text-align: center; transition: .3s; }
  .card { background: var(--card); max-width: 500px; margin: 30px auto; padding: 24px; border-radius: 12px; }
  h1 { color: var(--accent); }
  button { margin: 5px; padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:hover { opacity: .85; }
</style>
</head>
<body data-theme="light">
  <h1>Choose Your Theme</h1>
  <div>
    <button onclick="setTheme('light')">Light</button>
    <button onclick="setTheme('dark')">Dark</button>
    <button onclick="setTheme('blue')">Blue</button>
    <button onclick="setTheme('green')">Green</button>
    <button onclick="setTheme('purple')">Purple</button>
  </div>
  <div class="card">
    <h2>Sample Card</h2>
    <p>Click any button above to change the color theme of this page. Your choice is saved and restored when you reload.</p>
  </div>

<script>
function setTheme(name) {
  document.body.setAttribute("data-theme", name);
  try { localStorage.setItem("theme", name); } catch (e) {}
}
try { setTheme(localStorage.getItem("theme") || "light"); } catch (e) {}
</script>
</body>
</html>
