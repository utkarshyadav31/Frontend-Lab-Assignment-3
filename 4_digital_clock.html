<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Clock</title>
<style>
  body { background: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: "Courier New", monospace; }
  .clock { text-align: center; padding: 40px 60px; border: 2px solid #00ff9c; border-radius: 16px; box-shadow: 0 0 25px rgba(0,255,156,.4); }
  #time { font-size: 72px; color: #00ff9c; letter-spacing: 4px; text-shadow: 0 0 12px #00ff9c; }
  #date { font-size: 22px; color: #9aa4b2; margin-top: 10px; }
  button { margin-top: 20px; padding: 8px 16px; background: transparent; border: 1px solid #00ff9c; color: #00ff9c; border-radius: 6px; cursor: pointer; font-family: inherit; }
  @media (max-width: 500px) { #time { font-size: 42px; } .clock { padding: 25px; } }
</style>
</head>
<body>
<div class="clock">
  <div id="time"></div>
  <div id="date"></div>
  <button onclick="toggleFormat()" id="fmtBtn">Switch to 12-hour</button>
</div>

<script>
let is24 = true;

function pad(n) { return String(n).padStart(2, "0"); }

function updateClock() {
  const now = new Date();
  let h = now.getHours();
  let suffix = "";
  if (!is24) {
    suffix = h >= 12 ? " PM" : " AM";
    h = h % 12 || 12;
  }
  document.getElementById("time").textContent =
    `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}${suffix}`;
  document.getElementById("date").textContent = now.toLocaleDateString(undefined,
    { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

function toggleFormat() {
  is24 = !is24;
  document.getElementById("fmtBtn").textContent = is24 ? "Switch to 12-hour" : "Switch to 24-hour";
  updateClock();
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
