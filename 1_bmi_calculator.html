<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI Calculator</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  h2 { text-align: center; margin-top: 0; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 16px; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #2f7de1; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1f63bd; }
  #result { margin-top: 20px; text-align: center; font-size: 18px; min-height: 60px; }
  .underweight { color: #e69500; } .normal { color: #1e9e4a; } .overweight { color: #d62828; }
  .error { color: #d62828; }
</style>
</head>
<body>
<div class="card">
  <h2>BMI Calculator</h2>
  <label for="height">Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 170" min="1">
  <label for="weight">Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 65" min="1">
  <button onclick="calculateBMI()">Calculate BMI</button>
  <div id="result"></div>
</div>

<script>
function calculateBMI() {
  const h = parseFloat(document.getElementById("height").value);
  const w = parseFloat(document.getElementById("weight").value);
  const result = document.getElementById("result");

  if (!h || !w || h <= 0 || w <= 0) {
    result.innerHTML = '<span class="error">Please enter valid height and weight.</span>';
    return;
  }

  const bmi = w / ((h / 100) ** 2);
  let category, cls;
  if (bmi < 18.5)      { category = "Underweight"; cls = "underweight"; }
  else if (bmi < 25)   { category = "Normal";      cls = "normal"; }
  else                 { category = "Overweight";  cls = "overweight"; }

  result.innerHTML = `Your BMI: <b>${bmi.toFixed(1)}</b><br>
    Category: <b class="${cls}">${category}</b>`;
}
</script>
</body>
</html>
